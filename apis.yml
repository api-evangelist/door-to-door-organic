name: Door-to-Door Organic
description: Door to Door Organics was an organic and natural grocery home-delivery service founded in
  1997 and headquartered in Louisville, Colorado. It delivered fresh local and organic produce boxes
  along with pantry staples, dairy, eggs, meat, and bread to homes and offices across roughly 17 states
  in the West, Midwest, and East Coast (including Washington, D.C.). Backed by Battery Ventures among
  others, the company raised about $44.4M over six rounds before abruptly ceasing operations in 2017.
  It was surfaced as a Battery Ventures portfolio company and added to the API Evangelist network as a
  lead. Enrichment found no public developer surface (no portal, documentation, OpenAPI, or API host);
  the company is defunct and publishes no API.
